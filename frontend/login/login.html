<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Caffè D'Autore</title>
    <link rel="stylesheet" href="login.css">
    
    <!-- Font Awesome para o ícone de seta -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- BOTÃO FLUTUANTE DE VOLTAR (Canto Superior Esquerdo - Círculo com Seta) -->
    <a href="../loja/loja.html" class="btn-voltar-loja" title="Voltar para a loja">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="vintage-container">
        <header class="header-vintage">
            <h1>Caffè D'Autore</h1>
            <p class="subtitle">Acesse sua Conta</p>
        </header>

        <form id="formLogin" class="form-vintage">
            <div id="mensagem" class="mensagem-status"></div>

            <div class="grupo-input">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="grupo-input">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••">
                <div style="text-align: right; margin-top: 6px;">
                    <a href="../esqueci-senha/recuperar-senha.html" id="btnEsqueciSenha" style="font-size: 11px; color: #a17b59; text-decoration: underline;">Esqueci minha senha</a>
                </div>
            </div>

            <button type="submit" class="btn-vintage">Entrar</button>
        </form>

        <footer class="footer-link">
            <p>Ainda não é cliente? <a href="../cadastro/cadastro.html">Cadastre-se aqui</a></p>
        </footer>
    </div>

    <script src="login.js"></script>
</body>
</html>
