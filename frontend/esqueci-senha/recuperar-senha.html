<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | Caffè D'Autore</title>

    <link rel="stylesheet" href="recuperar-senha.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="recuperar-senha.js" defer></script>
</head>
<body>

    <main class="auth-wrapper">
        <div class="auth-card">
            <a href="../login/login.html" class="back-link">← Voltar para o login</a>

            <div class="brand-header">
                <span class="small-label">SEGURANÇA DA CONTA</span>
                <h1>Redefinir Senha</h1>
                <p id="subtituloRecuperacao">Informe seu e-mail cadastrado para receber o código de verificação.</p>
            </div>

            <!-- MENSAGENS DE FEEDBACK -->
            <div id="boxFeedback" class="feedback-box" style="display: none;"></div>

            <!-- PASSO 1: SOLICITAR CÓDIGO POR E-MAIL -->
            <form id="formSolicitarCodigo" class="auth-form">
                <div class="form-group">
                    <label for="emailRecuperacao">E-mail cadastrado</label>
                    <div class="email-action-row">
                        <input type="email" id="emailRecuperacao" placeholder="seuemail@exemplo.com" required>
                        <button type="submit" id="btnEnviarCodigo" class="btn-secondary">
                            Enviar código
                        </button>
                    </div>
                </div>
            </form>

            <div class="divider"></div>

            <!-- PASSO 2: INSERIR CÓDIGO E NOVA SENHA -->
            <form id="formRedefinirSenha" class="auth-form">
                <div class="form-group">
                    <label for="codigoVerificacao">Código de verificação (6 dígitos)</label>
                    <input type="text" id="codigoVerificacao" placeholder="000000" maxlength="6" inputmode="numeric" required>
                </div>

                <div class="form-group">
                    <label for="novaSenha">Nova senha (mínimo 8 caracteres)</label>
                    <div class="password-wrapper">
                        <input type="password" id="novaSenha" placeholder="Digite a nova senha" minlength="8" required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar senha" onclick="alternarVisibilidadeSenha('novaSenha', this)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmarNovaSenha">Confirmar nova senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmarNovaSenha" placeholder="Repita a nova senha" minlength="8" required>
                        <button type="button" class="toggle-pass" aria-label="Mostrar senha" onclick="alternarVisibilidadeSenha('confirmarNovaSenha', this)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnSalvarNovaSenha" class="btn-primary">
                    Salvar Nova Senha
                </button>
            </form>
        </div>
    </main>

</body>
</html>
