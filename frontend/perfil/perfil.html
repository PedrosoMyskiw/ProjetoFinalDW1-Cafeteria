<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | Caffè D'Autore</title>
    <link rel="stylesheet" href="perfil.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="header">
        <a href="../loja/loja.html" class="logo">
            <span>CAFFÈ</span>
            <strong>D'AUTORE</strong>
        </a>
        
        <div class="header-actions">
            <a href="../loja/loja.html" class="btn-voltar">Voltar para a Loja</a>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="perfil-container">
        
        <!-- CARTÃO DE INFORMAÇÕES DO CLIENTE -->
        <section class="perfil-card">
            <div class="perfil-header">
                <div class="user-avatar-large" id="avatarGrande">U</div>
                <div>
                    <h1 id="nomeCliente">Carregando...</h1>
                    <p id="emailCliente">carregando@email.com</p>
                    <span class="badge-tipo" id="tipoCliente">Cliente</span>
                </div>
                <button type="button" class="btn-editar-perfil" id="btnAlternarEdicao" onclick="alternarModoEdicao()">✏️ Editar Perfil</button>
            </div>

            <!-- MODO VISUALIZAÇÃO -->
            <div class="perfil-details" id="modoVisualizacao">
                <h3>Dados Cadastrais</h3>
                <div class="details-grid">
                    <div class="detail-item">
                        <span>Telefone:</span>
                        <strong id="infoTelefone">-</strong>
                    </div>
                    <div class="detail-item">
                        <span>CEP:</span>
                        <strong id="infoCep">-</strong>
                    </div>
                    <div class="detail-item">
                        <span>Endereço:</span>
                        <strong id="infoEndereco">-</strong>
                    </div>
                    <div class="detail-item">
                        <span>Cidade / UF:</span>
                        <strong id="infoCidadeUf">-</strong>
                    </div>
                </div>
            </div>

            <!-- MODO EDIÇÃO (FORMULÁRIO) -->
            <form class="form-edicao-perfil" id="formEdicaoPerfil" style="display: none;" onsubmit="salvarAlteracoesPerfil(event)">
                <h3>Editar Informações</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="editNome">Nome Completo</label>
                        <input type="text" id="editNome" required>
                    </div>
                    <div class="form-group">
                        <label for="editTelefone">Telefone</label>
                        <input type="text" id="editTelefone" placeholder="(00) 00000-0000">
                    </div>
                    <div class="form-group">
                        <label for="editCep">CEP</label>
                        <input type="text" id="editCep" placeholder="00000-000">
                    </div>
                    <div class="form-group">
                        <label for="editLogradouro">Logradouro / Rua</label>
                        <input type="text" id="editLogradouro">
                    </div>
                    <div class="form-group">
                        <label for="editNumero">Número</label>
                        <input type="text" id="editNumero">
                    </div>
                    <div class="form-group">
                        <label for="editComplemento">Complemento</label>
                        <input type="text" id="editComplemento">
                    </div>
                    <div class="form-group">
                        <label for="editBairro">Bairro</label>
                        <input type="text" id="editBairro">
                    </div>
                    <div class="form-group">
                        <label for="editCidade">Cidade</label>
                        <input type="text" id="editCidade">
                    </div>
                    <div class="form-group">
                        <label for="editEstado">Estado (UF)</label>
                        <input type="text" id="editEstado" maxlength="2" placeholder="SP">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancelar" onclick="alternarModoEdicao()">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar Alterações</button>
                </div>
            </form>
        </section>

        <!-- HISTÓRICO DE PEDIDOS -->
        <section class="pedidos-card">
            <div class="pedidos-header">
                <h2>Meus Pedidos ☕</h2>
                <p>Acompanhe suas compras recentes</p>
            </div>

            <div class="pedidos-lista" id="containerMeusPedidos">
                <p class="loading-text">Carregando histórico de pedidos...</p>
            </div>
        </section>

    </main>

    <script src="perfil.js"></script>
</body>
</html>
